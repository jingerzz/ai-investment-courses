[project]
name = "spy-tlt-course"
version = "1.0.0"
description = "SPY/TLT Color Strategy — Course Edition (standalone, no broker dependencies)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.20.0",
    "numpy>=1.24.0",
    "yfinance>=0.2.0",
    "pandas>=2.0.0",
]

[project.scripts]
spy-tlt-server = "spy_tlt_course.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spy_tlt_course"]
